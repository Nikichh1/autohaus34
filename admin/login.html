<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Auto House Admin — Login</title>
<link rel="stylesheet" href="/admin/admin.css?v=20260909-admin1">
</head>
<body class="login-page">
<main class="login-card">
  <a class="login-brand" href="/">AUTO HOUSE <span>Admin</span></a>
  <h1>Вход</h1>
  <form id="login-form" novalidate>
    <label><span>Имейл</span><input name="email" type="email" autocomplete="username" required autofocus></label>
    <label><span>Парола</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Вход</button>
    <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(function(){
  "use strict";
  fetch('/api/admin/auth').then(function(r){ if(r.ok) location.replace('/admin'); }).catch(function(){});
  var form=document.getElementById('login-form'), status=document.getElementById('login-status');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var btn=form.querySelector('button'), email=form.elements.email.value.trim(), password=form.elements.password.value;
    if(!email||!password){status.textContent='Попълнете имейл и парола.';return;}
    btn.disabled=true;btn.textContent='Влизане…';status.textContent='';
    fetch('/api/admin/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({email:email,password:password})})
      .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Грешен имейл или парола.');return d;});})
      .then(function(){location.replace('/admin');})
      .catch(function(err){status.textContent=err.message||'Неуспешен вход.';})
      .then(function(){btn.disabled=false;btn.textContent='Вход';});
  });
})();
</script>
</body>
</html>
