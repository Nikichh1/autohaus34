name: Generate high-resolution product images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'Run hires product variant generation')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Sharp
        run: npm install sharp@0.33.5 --no-save --no-audit --no-fund
      - name: Generate 1920px protected product images
        run: node scripts/generate-hires-product-images.js
