name: Refresh owned-v2 watermarks

on:
  push:
    branches: [main]

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Run owned-v2 watermark refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install image tooling
        run: npm install --omit=dev
      - name: Generate owned-v2 protected variants
        run: node scripts/refresh-owned-watermarks.js
