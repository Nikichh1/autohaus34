name: AutoHaus ownership staging

on:
  pull_request:
    paths:
      - ".github/ownership-stage-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run ownership staging
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 20 https://github.com/Nikichh1/autohaus34.git work
          cd work
          git fetch origin "${{ github.event.pull_request.head.sha }}" --depth=1
          git checkout "${{ github.event.pull_request.head.sha }}"
          node --version
          node scripts/run-ownership-stage.js
