name: AutoHaus ownership staging

on:
  push:
    paths:
      - ".github/workflows/ownership-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Copy live inventory and media into staging
        run: node scripts/run-ownership-stage.js
